<!doctype html>
<html lang="ar" dir="rtl" translate="no" class="notranslate">
<head>
<meta charset="utf-8">
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LoLoTube لولوتيوب — قنوات هادفة للأطفال</title>
<meta name="description" content="لولوتيوب: يوتيوب مفلتر للأطفال فيه القنوات الهادفة فقط — دينية، أخلاقية، فكرية، تعليمية، ترفيهية، رياضية، ولغات ونطق.">
<meta name="theme-color" content="#a855f7">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fdf6ff; --card:#ffffff; --text:#2b1d4a; --muted:#7a6f93; --line:rgba(91,61,160,.12);
  --p1:#7c3aed; --p2:#ec4899;
  --rainbow:linear-gradient(90deg,#f43f5e,#f59e0b,#eab308,#22c55e,#06b6d4,#6366f1,#d946ef,#f43f5e);
  --shadow:0 10px 26px rgba(91,61,160,.16); --bar:58px; --nav:64px;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{margin:0}
html{overflow-x:clip}
body{font-family:"Baloo Bhaijaan 2",system-ui,"Segoe UI",Tahoma,sans-serif; color:var(--text); min-height:100vh; overflow-x:hidden;
  background:radial-gradient(1200px 700px at 10% -10%,#ffd6f3 0,transparent 60%),radial-gradient(1000px 700px at 110% 10%,#d4e4ff 0,transparent 60%),radial-gradient(900px 600px at 50% 110%,#d6ffe9 0,transparent 60%),#f3ecff}
button,input{font-family:inherit; color:inherit}

/* خلفية سحرية: فقاعات ونجوم */
.sky{position:fixed; inset:0; pointer-events:none; z-index:0; overflow:hidden}
.sky i{position:absolute; bottom:-80px; border-radius:50%; opacity:.5; animation:float linear infinite; background:radial-gradient(circle at 30% 30%,#fff,var(--c) 62%)}
.sky b{position:absolute; color:#fbbf24; animation:twinkle 3s ease-in-out infinite; font-weight:400}
@keyframes float{to{transform:translateY(-125vh) translateX(var(--dx))}}
@keyframes twinkle{50%{opacity:.2; transform:scale(.6) rotate(25deg)}}

/* إطار التطبيق: الهاتف هو الافتراضي */
.app{position:relative; z-index:1; margin:0 auto; min-height:100vh; background:var(--bg); display:flex; flex-direction:column}
body.phone .app{max-width:430px; box-shadow:0 30px 80px rgba(91,61,160,.25)}
@media (min-width:600px){ body.phone .app{margin:16px auto; min-height:calc(100vh - 32px); border-radius:40px; border:10px solid #1f1536; overflow:clip} }
body.desk .app{max-width:none}

/* الشريط العلوي */
.top{position:sticky; top:0; z-index:30; height:var(--bar); flex:none; display:flex; align-items:center; gap:8px; padding:0 12px; background:rgba(253,246,255,.9); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); border-bottom:1px solid var(--line)}
.logo{display:flex; align-items:center; gap:7px; border:0; background:none; padding:0; cursor:pointer; direction:ltr}
.logo svg{width:38px; height:38px; animation:wob 3.5s ease-in-out infinite}
@keyframes wob{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(6deg) scale(1.07)}}
.logo b{font-size:26px; font-weight:800; line-height:1; background:var(--rainbow); background-size:300% 100%; -webkit-background-clip:text; background-clip:text; color:transparent; animation:rain 6s linear infinite}
@keyframes rain{to{background-position:-300% 0}}
.sp{flex:1}
.ib{width:40px; height:40px; border-radius:50%; border:0; background:#fff; box-shadow:0 3px 10px rgba(91,61,160,.15); font-size:18px; cursor:pointer; display:grid; place-items:center; transition:transform .15s; flex:none}
.ib:active{transform:scale(.88)}

/* البحث */
.search{display:none; position:sticky; top:var(--bar); z-index:29; padding:8px 12px; background:rgba(253,246,255,.96); border-bottom:1px solid var(--line)}
.search.open{display:flex; gap:8px}
.search input{flex:1; min-width:0; height:44px; border-radius:999px; border:2.5px solid transparent; padding:0 16px; font-size:16px; outline:0; background:linear-gradient(#fff,#fff) padding-box, var(--rainbow) border-box}

/* شرائح الأنواع */
.chips{display:flex; gap:8px; overflow-x:auto; padding:10px 12px 8px; scrollbar-width:none; position:sticky; top:var(--bar); z-index:20; background:linear-gradient(var(--bg) 80%,transparent)}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none; border:0; cursor:pointer; border-radius:999px; padding:7px 14px; font-size:15px; font-weight:700; background:#fff; box-shadow:0 2px 8px rgba(91,61,160,.12); display:flex; align-items:center; gap:5px; transition:transform .15s}
.chip:active{transform:scale(.92)}
.chip.on{color:#fff; background:linear-gradient(135deg,var(--a),var(--b)); box-shadow:0 6px 16px color-mix(in srgb,var(--b) 45%,transparent); transform:translateY(-1px)}

/* رف القنوات (كالقصص) */
.shelf{display:flex; gap:12px; overflow-x:auto; padding:6px 12px 12px; scrollbar-width:none}
.shelf::-webkit-scrollbar{display:none}
.ch{flex:none; width:76px; text-align:center; cursor:pointer; border:0; background:none; padding:0}
.ring{width:70px; height:70px; margin:0 auto 4px; border-radius:50%; padding:3px; background:conic-gradient(from var(--ang),#f43f5e,#f59e0b,#22c55e,#06b6d4,#8b5cf6,#f43f5e); animation:spin 4s linear infinite}
@property --ang{syntax:"<angle>"; inherits:false; initial-value:0deg}
@keyframes spin{to{--ang:360deg}}
.ring img{width:100%; height:100%; border-radius:50%; border:3px solid #fff; object-fit:cover; background:#f3e8ff; display:block}
.ch span{font-size:12.5px; font-weight:700; line-height:1.25; overflow:hidden; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical}

.sec{display:flex; align-items:center; gap:8px; padding:6px 14px 2px; font-size:18px; font-weight:800}
.sec small{color:var(--muted); font-weight:600; font-size:13px}

/* شبكة المقاطع بأسلوب يوتيوب */
.feed{display:grid; gap:18px; padding:8px 12px 18px; grid-template-columns:1fr}
body.desk .feed{grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); padding:12px 22px 26px; gap:22px 18px}
.vc{cursor:pointer; animation:pop .45s ease both}
@keyframes pop{from{opacity:0; transform:translateY(14px) scale(.98)}}
.th{position:relative; aspect-ratio:16/9; border-radius:18px; overflow:hidden; background:linear-gradient(135deg,#e9d5ff,#fbcfe8); box-shadow:var(--shadow)}
.th img{width:100%; height:100%; object-fit:cover; display:block; transition:transform .4s}
.vc:hover .th img{transform:scale(1.06)}
.th .d{position:absolute; bottom:8px; left:8px; background:rgba(20,10,40,.82); color:#fff; font-size:12.5px; border-radius:8px; padding:1px 7px; direction:ltr; font-family:system-ui,sans-serif}
.th .pl{position:absolute; inset:0; display:grid; place-items:center; opacity:0; transition:.2s; background:rgba(40,10,70,.15)}
.th .pl span{width:58px; height:58px; border-radius:50%; background:rgba(255,255,255,.95); display:grid; place-items:center; font-size:24px; color:var(--p2); box-shadow:0 6px 18px rgba(0,0,0,.25)}
.vc:hover .th .pl{opacity:1}
.meta{display:flex; gap:10px; padding:10px 2px 0; align-items:flex-start}
.meta img{width:38px; height:38px; border-radius:50%; flex:none; object-fit:cover; background:#f3e8ff; border:2px solid #fff; box-shadow:0 2px 6px rgba(0,0,0,.12)}
.meta .mt{flex:1; min-width:0}
.meta b{font-size:15.5px; font-weight:700; line-height:1.45; overflow:hidden; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical}
.meta small{display:block; color:var(--muted); font-size:13px; margin-top:1px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.heart{flex:none; width:36px; height:36px; border:0; background:none; font-size:20px; cursor:pointer; filter:grayscale(1); opacity:.45; transition:.2s}
.heart.on{filter:none; opacity:1; transform:scale(1.12)}
.more{display:grid; place-items:center; padding:14px; color:var(--muted); font-weight:700}
.loader{width:34px; height:34px; border-radius:50%; border:4px solid #e9d5ff; border-top-color:var(--p2); animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

/* صفحة المشاهدة */
.watch .player{position:sticky; top:var(--bar); z-index:25; background:#000; aspect-ratio:16/9}
body.desk .watch{display:grid; grid-template-columns:minmax(0,1fr) 400px; gap:22px; padding:16px 22px; align-items:start}
body.desk .watch .player{border-radius:20px; overflow:hidden; top:calc(var(--bar) + 12px); box-shadow:var(--shadow)}
.player iframe{width:100%; height:100%; border:0; display:block}
.wt{padding:12px 14px 6px}
.wt h1{margin:0; font-size:19px; line-height:1.45; font-weight:800}
.wt .row{display:flex; align-items:center; gap:10px; margin-top:10px}
.wt .row img{width:46px; height:46px; border-radius:50%; object-fit:cover; cursor:pointer}
.wt .row .who{flex:1; min-width:0; cursor:pointer} .wt .row b{display:block; font-size:16px; line-height:1.3} .wt .row small{color:var(--muted); font-size:13px}
.pill{border:0; cursor:pointer; border-radius:999px; padding:8px 16px; font-weight:800; font-size:14.5px; color:#fff; background:linear-gradient(135deg,var(--p2),var(--p1)); box-shadow:0 6px 14px rgba(236,72,153,.35); flex:none}
.pill.ghost{background:#fff; color:var(--text); box-shadow:0 2px 8px rgba(91,61,160,.15)}
.next .feed{gap:12px}
.next .vc{display:grid; grid-template-columns:44% minmax(0,1fr); gap:10px; align-items:start}
.next .vc .th{border-radius:12px} .next .vc .meta{padding:0} .next .vc .meta img,.next .vc .heart{display:none} .next .vc .meta b{font-size:14px}
body.desk .next .feed{grid-template-columns:1fr; padding:0}

/* صفحة القناة */
.banner{height:118px; background:linear-gradient(120deg,var(--a,#a78bfa),var(--b,#f472b6)); position:relative; overflow:hidden}
.banner::before,.banner::after{content:""; position:absolute; border-radius:50%; background:rgba(255,255,255,.18)}
.banner::before{width:160px; height:160px; top:-60px; right:-30px} .banner::after{width:110px; height:110px; bottom:-50px; left:20%}
.chead{display:flex; align-items:flex-end; gap:12px; padding:0 14px 6px; margin-top:-40px; position:relative}
.chead .ring{width:88px; height:88px; margin:0}
.chead>div:last-child{padding-top:46px; min-width:0}
.chead b{display:block; font-size:20px; font-weight:800; line-height:1.3}
.chead small{color:var(--muted); font-size:13.5px}

.cgrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(96px,1fr)); gap:14px 8px; padding:8px 12px 18px}
.cgrid .ch{width:auto}

/* الشريط السفلي مثل تطبيق يوتيوب */
.nav{position:sticky; bottom:0; z-index:30; height:var(--nav); margin-top:auto; flex:none; display:flex; background:rgba(255,255,255,.96); backdrop-filter:blur(12px); border-top:1px solid var(--line); padding-bottom:env(safe-area-inset-bottom)}
.nav button{flex:1; border:0; background:none; cursor:pointer; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:0; font-size:12.5px; font-weight:700; color:var(--muted)}
.nav button i{font-style:normal; font-size:22px; transition:transform .2s}
.nav button.on{color:var(--p1)} .nav button.on i{transform:translateY(-3px) scale(1.18)}
body.desk .top{order:-2}
body.desk .nav{position:sticky; top:var(--bar); bottom:auto; order:-1; height:48px; margin:0; border-top:0; border-bottom:1px solid var(--line); justify-content:center; gap:6px}
body.desk .nav button{flex:none; flex-direction:row; gap:6px; padding:0 16px; font-size:15px}
body.desk .nav button i{font-size:18px}

.empty{text-align:center; color:var(--muted); padding:44px 20px; font-weight:700}
.empty span{display:block; font-size:56px}
.foot{text-align:center; color:var(--muted); font-size:13px; padding:6px 0 18px}
.foot b{color:var(--p1)}
.toast{position:fixed; bottom:84px; left:50%; transform:translateX(-50%); z-index:60; background:#2b1d4a; color:#fff; padding:9px 16px; border-radius:14px; font-weight:700; opacity:0; transition:.25s; pointer-events:none; max-width:90vw}
.toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){ *{animation:none!important} }
</style>
</head>
<body class="phone">
<div class="sky" id="sky"></div>
<div class="app" id="app">
  <header class="top">
    <button class="logo" id="home" aria-label="الرئيسية">
      <svg viewBox="0 0 64 64" aria-hidden="true"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f472b6"/><stop offset=".5" stop-color="#a855f7"/><stop offset="1" stop-color="#3b82f6"/></linearGradient></defs><rect x="4" y="11" width="56" height="44" rx="17" fill="url(#lg)"/><path d="M27 23 L43 33 L27 43 Z" fill="#fff"/><circle cx="13" cy="9" r="4.5" fill="#fbbf24"/><circle cx="51" cy="8" r="3.2" fill="#34d399"/><circle cx="58" cy="17" r="2" fill="#f472b6"/></svg>
      <b>LoLoTube</b>
    </button>
    <span class="sp"></span>
    <button class="ib" id="searchBtn" aria-label="بحث" title="بحث">🔍</button>
    <button class="ib" id="viewBtn" aria-label="طريقة العرض" title="عرض الحاسوب">🖥️</button>
  </header>
  <div class="search" id="search"><input id="q" type="search" placeholder="ابحث عن مقطع أو قناة…" autocomplete="off"><button class="pill" id="go">بحث</button></div>
  <main id="main"></main>
  <nav class="nav" id="nav">
    <button data-nav="home"><i>🏠</i>الرئيسية</button>
    <button data-nav="channels"><i>📺</i>القنوات</button>
    <button data-nav="fav"><i>💖</i>المفضلة</button>
    <button data-nav="history"><i>🕘</i>شاهدتُ</button>
  </nav>
</div>
<div class="toast" id="toast"></div>

<script>
/* ============ أدوات ============ */
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const store = { get(k, d){ try { const v = localStorage.getItem("lolo-" + k); return v ? JSON.parse(v) : d; } catch(e){ return d; } },
                set(k, v){ try { localStorage.setItem("lolo-" + k, JSON.stringify(v)); } catch(e){} } };
let tT; const toast = m => { const t = $("toast"); t.textContent = m; t.classList.add("show"); clearTimeout(tT); tT = setTimeout(() => t.classList.remove("show"), 2600); };
const thumb = id => "https://i.ytimg.com/vi/" + id + "/hqdefault.jpg";

/* ============ البيانات ============ */
let D = {cats:[], channels:[]}, CH = {}, VID = {};
let favs = store.get("favs", []), hist = store.get("hist", []);
let state = {cat:"all"};

/* ============ الخلفية السحرية ============ */
(function(){
  const s = $("sky"), cols = ["#f9a8d4","#c4b5fd","#93c5fd","#86efac","#fde68a"];
  for (let i = 0; i < 16; i++){ const b = document.createElement("i"), z = 14 + Math.random() * 46;
    b.style.cssText = `left:${Math.random()*100}%;width:${z}px;height:${z}px;--c:${cols[i%5]};--dx:${(Math.random()-.5)*160}px;animation-duration:${14+Math.random()*16}s;animation-delay:${-Math.random()*20}s`; s.appendChild(b); }
  for (let i = 0; i < 14; i++){ const t = document.createElement("b"); t.textContent = i % 3 ? "✦" : "★";
    t.style.cssText = `left:${Math.random()*100}%;top:${Math.random()*100}%;font-size:${8+Math.random()*14}px;animation-delay:${-Math.random()*3}s`; s.appendChild(t); }
})();

/* ============ طريقة العرض: الهاتف هو الافتراضي ============ */
function setView(v, save){
  document.body.classList.toggle("phone", v !== "desk"); document.body.classList.toggle("desk", v === "desk");
  $("viewBtn").textContent = v === "desk" ? "📱" : "🖥️"; $("viewBtn").title = v === "desk" ? "عرض الهاتف" : "عرض الحاسوب";
  if (save){ store.set("view", v); toast(v === "desk" ? "🖥️ عرض الحاسوب" : "📱 عرض الهاتف"); }
}
setView(store.get("view", "phone"));
$("viewBtn").onclick = () => setView(document.body.classList.contains("desk") ? "phone" : "desk", true);

/* ============ البطاقات ============ */
const catOf = id => D.cats.find(c => c.id === id) || {};
function card(v){
  const c = CH[v.c] || {};
  return `<div class="vc" data-v="${v.id}">
    <div class="th"><img loading="lazy" src="${thumb(v.id)}" alt="">${v.d ? `<span class="d">${esc(v.d)}</span>` : ""}<div class="pl"><span>▶</span></div></div>
    <div class="meta"><img loading="lazy" src="${esc(c.av || "")}" alt="" data-ch="${esc(v.c)}"><div class="mt"><b>${esc(v.t)}</b><small>${esc(c.n || "")}${v.a ? " · " + esc(v.a) : ""}</small></div>
    <button class="heart ${favs.includes(v.id) ? "on" : ""}" data-heart="${v.id}" aria-label="أضف إلى المفضلة">💖</button></div></div>`;
}
const chBtn = c => `<button class="ch" data-ch="${esc(c.id)}"><div class="ring"><img loading="lazy" src="${esc(c.av)}" alt=""></div><span>${esc(c.n)}</span></button>`;

/* خلط المقاطع بالتناوب بين القنوات حتى لا تطغى قناة واحدة */
function mix(chs){
  const lists = chs.map(c => (c.v || []).map(x => VID[x[0]]).filter(Boolean)), out = [];
  for (let i = 0; lists.some(l => i < l.length); i++) lists.forEach(l => { if (l[i]) out.push(l[i]); });
  return out;
}

/* عرض لا نهائي: يضيف المقاطع كلما اقترب الطفل من الأسفل */
let feedList = [], feedN = 0, feedMore = null;
function feed(list, moreFn){ feedList = list; feedN = 0; feedMore = moreFn || null; $("feed").innerHTML = ""; addFeed(); io.observe($("feedEnd")); }
function addFeed(){
  const el = $("feed"); if (!el) return;
  const chunk = feedList.slice(feedN, feedN + 16); feedN += chunk.length;
  el.insertAdjacentHTML("beforeend", chunk.map(card).join(""));
  const m = $("feedEnd"); if (m) m.innerHTML = (feedN < feedList.length || feedMore) ? '<div class="loader"></div>' : "✨ وصلتَ إلى النهاية ✨";
}
const io = new IntersectionObserver(es => es.forEach(async e => {
  if (!e.isIntersecting) return;
  if (feedN < feedList.length) return addFeed();
  if (feedMore){ const f = feedMore; feedMore = null; const more = await f(); const m = $("feedEnd");
    if (more && more.length){ feedList = feedList.concat(more); feedMore = f; addFeed(); } else if (m) m.innerHTML = "✨ وصلتَ إلى النهاية ✨"; }
}), {rootMargin:"700px"});

/* ============ الصفحات ============ */
const navOn = n => document.querySelectorAll("[data-nav]").forEach(b => b.classList.toggle("on", b.dataset.nav === n));
const chipsHTML = () => `<div class="chips" id="chips">${D.cats.map(c => `<button class="chip ${state.cat === c.id ? "on" : ""}" data-cat="${c.id}" style="--a:${c.a};--b:${c.b}">${c.ic} ${esc(c.t)}</button>`).join("")}</div>`;
const feedHTML = () => `<div class="feed" id="feed"></div><div class="more" id="feedEnd"></div>`;

function pageHome(){
  navOn("home");
  const chs = state.cat === "all" ? D.channels : D.channels.filter(c => c.cats.includes(state.cat)), cat = catOf(state.cat);
  $("main").innerHTML = chipsHTML() +
    `<div class="sec">${state.cat === "all" ? "🌟 كل القنوات" : cat.ic + " " + esc(cat.t)} <small>${chs.length} قناة</small></div>
     <div class="shelf">${chs.map(chBtn).join("")}</div><div class="sec">🎬 مقاطع لك</div>` + feedHTML() +
    `<div class="foot">لولوتيوب · قنوات هادفة فقط · تصميم <b>لوجيكال كود</b></div>`;
  feed(mix(chs));
  const on = document.querySelector(".chip.on"); if (on) on.scrollIntoView({inline:"center", block:"nearest"});
}
function pageChannel(id){
  navOn("channels");
  const c = CH[id]; if (!c) return pageHome();
  const cat = catOf(c.cats[0]);
  $("main").innerHTML = `<div class="banner" style="--a:${cat.a || "#a78bfa"};--b:${cat.b || "#f472b6"}"></div>
    <div class="chead"><div class="ring"><img src="${esc(c.av)}" alt=""></div><div><b>${esc(c.n)}</b><small>${esc(c.s || "")}</small><br><small>${c.cats.map(x => catOf(x).ic + " " + esc(catOf(x).t)).join(" · ")}</small></div></div>` + feedHTML();
  feed((c.v || []).map(x => VID[x[0]]).filter(Boolean), () => liveChannel(c)); scrollTo(0, 0);
}
function pageChannels(){
  navOn("channels");
  $("main").innerHTML = D.cats.filter(c => c.id !== "all").map(cat => {
    const chs = D.channels.filter(c => c.cats.includes(cat.id)); if (!chs.length) return "";
    return `<div class="sec">${cat.ic} ${esc(cat.t)} <small>${chs.length}</small></div><div class="cgrid">${chs.map(chBtn).join("")}</div>`;
  }).join("") + `<div class="foot">تصميم <b>لوجيكال كود</b></div>`;
  scrollTo(0, 0);
}
function pageList(kind){
  navOn(kind);
  const list = (kind === "fav" ? favs : hist).map(id => VID[id]).filter(Boolean);
  $("main").innerHTML = `<div class="sec">${kind === "fav" ? "💖 المفضلة" : "🕘 شاهدتُ مؤخراً"}</div>` +
    (list.length ? feedHTML() : `<div class="empty"><span>${kind === "fav" ? "💝" : "🎈"}</span>${kind === "fav" ? "اضغط القلب 💖 على أي مقطع ليظهر هنا" : "لم تشاهد شيئاً بعد"}</div>`);
  if (list.length) feed(list);
  scrollTo(0, 0);
}
function pageSearch(q){
  navOn("");
  const n = s => String(s || "").toLowerCase().replace(/[ً-ْـ]/g, "").replace(/[أإآ]/g, "ا").replace(/ة/g, "ه").replace(/ى/g, "ي");
  const w = n(q).split(/\s+/).filter(Boolean);
  const chs = D.channels.filter(c => w.every(x => n(c.n).includes(x)));
  const vs = Object.values(VID).filter(v => w.every(x => n(v.t + " " + (CH[v.c] || {}).n).includes(x))).slice(0, 150);
  $("main").innerHTML = `<div class="sec">🔍 ${esc(q)} <small>${vs.length} مقطع</small></div>` + (chs.length ? `<div class="shelf">${chs.map(chBtn).join("")}</div>` : "") +
    (vs.length ? feedHTML() : `<div class="empty"><span>🤔</span>لم نجد شيئاً… جرّب كلمة أخرى</div>`);
  if (vs.length) feed(vs);
  scrollTo(0, 0);
}
function pageWatch(id){
  navOn("");
  const v = VID[id]; if (!v) return pageHome();
  const c = CH[v.c] || {};
  hist = [id].concat(hist.filter(x => x !== id)).slice(0, 80); store.set("hist", hist);
  const all = (c.v || []).map(x => VID[x[0]]).filter(Boolean), i0 = all.findIndex(x => x.id === id);
  const after = all.slice(i0 + 1).concat(all.slice(0, Math.max(i0, 0)));
  const rel = mix(D.channels.filter(x => x.id !== c.id && x.cats.some(k => (c.cats || []).includes(k)))).slice(0, 30);
  // rel=0: يوتيوب يقترح من القناة نفسها فقط. والقائمة تكمل تلقائياً بمقاطع القناة المختارة.
  const src = "https://www.youtube-nocookie.com/embed/" + id + "?autoplay=1&rel=0&playsinline=1&iv_load_policy=3&hl=ar&playlist=" + [id].concat(after.slice(0, 40).map(x => x.id)).join(",");
  $("main").innerHTML = `<div class="watch">
    <div><div class="player"><iframe src="${src}" title="${esc(v.t)}" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe></div>
      <div class="wt"><h1>${esc(v.t)}</h1>
        <div class="row"><img src="${esc(c.av)}" alt="" data-ch="${esc(c.id)}"><div class="who" data-ch="${esc(c.id)}"><b>${esc(c.n)}</b><small>${esc(c.s || "")}</small></div>
          <button class="pill ghost" data-heart="${id}">${favs.includes(id) ? "💖 في المفضلة" : "🤍 أحببته"}</button></div></div></div>
    <div class="next"><div class="sec">⏭️ التالي</div>${feedHTML()}</div></div>`;
  feed(after.slice(0, 24).concat(rel)); scrollTo(0, 0);
}

/* ============ جلب مقاطع أقدم من القناة (مصدر مفتوح، اختياري) ============ */
const PIPED = ["https://api.piped.private.coffee"];
async function getJSON(u){ const ac = new AbortController(), tm = setTimeout(() => ac.abort(), 9000); try { const r = await fetch(u, {signal:ac.signal}); if (!r.ok) throw 0; return await r.json(); } finally { clearTimeout(tm); } }
const hms = s => { s = +s; if (!(s > 0)) return ""; const h = Math.floor(s/3600), m = Math.floor(s%3600/60), x = Math.floor(s%60); return (h ? h + ":" + String(m).padStart(2,"0") : m) + ":" + String(x).padStart(2,"0"); };
async function liveChannel(c){
  c._lv = c._lv || {}; if (c._lv.end) return [];
  for (const b of PIPED){
    try {
      for (let k = 0; k < 3; k++){
        const j = await getJSON(b + (c._lv.tok ? "/nextpage/channel/" + c.id + "?nextpage=" + encodeURIComponent(c._lv.tok) : "/channel/" + c.id));
        c._lv.tok = j.nextpage || null; if (!c._lv.tok) c._lv.end = true;
        const out = [];
        (j.relatedStreams || []).forEach(s => { const id = ((s.url || "").split("v=")[1] || "").slice(0, 11); if (!id || VID[id] || s.isShort) return;
          const v = {id, t:s.title, c:c.id, d:hms(s.duration), a:s.uploadedDate || ""}; VID[id] = v; c.v.push([id]); out.push(v); });
        if (out.length || c._lv.end) return out;
      }
    } catch(e){}
  }
  return [];
}

/* ============ التنقل ============ */
function route(){
  const [p, a] = decodeURIComponent(location.hash.replace(/^#\/?/, "")).split("/");
  if (p === "w") pageWatch(a); else if (p === "c") pageChannel(a); else if (p === "channels") pageChannels();
  else if (p === "fav" || p === "history") pageList(p); else if (p === "s") pageSearch(a || ""); else pageHome();
}
window.addEventListener("hashchange", route);
document.addEventListener("click", e => {
  const hb = e.target.closest("[data-heart]");
  if (hb){ e.stopPropagation(); const id = hb.dataset.heart, on = !favs.includes(id);
    favs = on ? [id].concat(favs) : favs.filter(x => x !== id); store.set("favs", favs);
    document.querySelectorAll(`[data-heart="${id}"]`).forEach(b => { b.classList.toggle("on", on); if (b.classList.contains("pill")) b.textContent = on ? "💖 في المفضلة" : "🤍 أحببته"; });
    toast(on ? "أُضيف إلى المفضلة 💖" : "أُزيل من المفضلة"); return; }
  const ch = e.target.closest("[data-ch]"); if (ch){ location.hash = "#/c/" + ch.dataset.ch; return; }
  const v = e.target.closest("[data-v]"); if (v){ location.hash = "#/w/" + v.dataset.v; return; }
  const ct = e.target.closest("[data-cat]"); if (ct){ state.cat = ct.dataset.cat; store.set("cat", state.cat); pageHome(); return; }
  const n = e.target.closest("[data-nav]"); if (n){ const h = n.dataset.nav === "home" ? "#/" : "#/" + n.dataset.nav; if (location.hash === h) route(); else location.hash = h; return; }
});
$("home").onclick = () => { if (location.hash && location.hash !== "#/") location.hash = "#/"; else pageHome(); scrollTo(0, 0); };
$("searchBtn").onclick = () => { $("search").classList.toggle("open"); if ($("search").classList.contains("open")) $("q").focus(); };
const doSearch = () => { const q = $("q").value.trim(); if (q) location.hash = "#/s/" + encodeURIComponent(q); };
$("go").onclick = doSearch; $("q").addEventListener("keydown", e => { if (e.key === "Enter") doSearch(); });

/* ============ البداية ============ */
state.cat = store.get("cat", "all");
fetch("data.json?v=1").then(r => r.json()).then(d => {
  D = d; D.channels.forEach(c => { CH[c.id] = c; (c.v || []).forEach(x => { VID[x[0]] = {id:x[0], t:x[1], c:c.id, d:x[2] || "", a:x[3] || ""}; }); });
  if (!D.cats.some(c => c.id === state.cat)) state.cat = "all";
  route();
}).catch(() => { $("main").innerHTML = '<div class="empty"><span>😕</span>تعذّر التحميل، أعد فتح الصفحة</div>'; });
if ("serviceWorker" in navigator) addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
</script>
