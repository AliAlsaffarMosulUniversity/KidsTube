name: Daily videos update
on:
  schedule:
    - cron: "17 3 * * *"   # يومياً 6:17 صباحاً بتوقيت بغداد
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch latest videos
        run: python tools/update.py
      - name: Commit if changed
        run: |
          if git diff --quiet data.json; then echo "no changes"; exit 0; fi
          git config user.name "lolotube-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          git commit -m "تحديث يومي للمقاطع $(date -u +%F)"
          git push
